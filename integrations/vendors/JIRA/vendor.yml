id: JIRA
name: "Jira Cloud"
description: "Jira Cloud is Atlassian's issue tracking and project management platform, used by security teams to open and follow remediation tickets with the teams that own the affected systems"
category: Collaboration
tags:
  - ticketing
  - collaboration
  - incident-response
  - api
homepage: "https://www.atlassian.com/software/jira"
visibility: 100
flow:
  description: "Create and follow Jira issues from SOC workflows, with full Jira Cloud REST v3 coverage."
  examples:
    - "Open a Jira ticket for the owning team when a case needs a fix such as a patch or config change"
    - "Link the Jira issue back to the TheHive case and comment progress"
    - "Close the case automatically when the Jira issue is resolved"
workflows:
  - name: "TheHive to Jira ITSM Sync"
    url: "https://strangebee.com/workflow/thehive-to-jira-itsm-sync/"
    description: "Automatically creates Jira issues from new TheHive alerts and synchronizes comments between both platforms. It prevents duplicate updates, keeps incident discussions aligned, and closes Jira issues when the corresponding alerts are resolved."
