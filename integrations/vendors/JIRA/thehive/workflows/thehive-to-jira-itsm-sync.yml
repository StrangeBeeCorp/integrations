version: v1.0.0
spec_version: chocolate-v2.0.0
id: playbook-01a08bd5-2c92-77df-aa88-aea4bb4c57ee
name: TheHive to Jira ITSM Sync
organisation: ~942084232
timeout: 24h0m0s
description: >-
  Exemple : a chaque nouvelle alerte TheHive (via webhook), cree une issue Jira
  miroir puis synchronise les commentaires dans les deux sens (avec marqueur
  anti-boucle) tant que l'alerte n'est pas cloturee. A la cloture, pousse le
  resume de l'alerte en commentaire final sur l'issue Jira.
