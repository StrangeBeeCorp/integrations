id: MSEntraID
name: "Microsoft Entra ID"
description: "Microsoft Entra ID (formerly Azure Active Directory) is an enterprise identity and access management platform that provides user authentication data, sign-in logs, and security insights to investigate account compromises, suspicious access patterns, and identity-based attacks"
category: Identity & Access Management
tags:
  - identity-management
  - authentication
  - access-control
  - user-activity
  - sign-in-logs
  - account-security
  - incident-response
homepage: "https://www.microsoft.com/security/business/identity-access/microsoft-entra-id"
visibility: 5
flow:
  description: "Investigate and contain compromised identities in Microsoft Entra ID."
  examples:
    - "On a phishing case, disable the user, revoke sessions and force a password reset"
    - "Enrich a user observable with roles, groups and MFA status to assess impact"
    - "Review recent sign-ins and risk detections for a suspected account takeover"
